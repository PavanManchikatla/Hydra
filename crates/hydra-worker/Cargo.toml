[package]
name = "hydra-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hydra stage worker: a thin effect executor. recv -> verify_frame (F1 fence + hard limits pre-alloc) -> decode -> the real hydra-state stage-session SM .step() -> execute effects (engine via hydra-engine-sys, acks) -> send. No parallel 'simple' path; the DST-tested SM is the one that runs (BLUEPRINT M2)."

[[bin]]
name = "hydra-worker"
path = "src/bin/hydra-worker.rs"

[[bin]]
name = "hydra-local-pair"
path = "src/bin/hydra-local-pair.rs"

[dependencies]
hydra-proto = { path = "../hydra-proto" }
hydra-state = { path = "../hydra-state" }
hydra-transport = { path = "../hydra-transport" }
hydra-engine-sys = { path = "../hydra-engine-sys" }
# Audit H6: O_NOFOLLOW on the shard open, and (dev, ino) identity across the two opens.
libc = "0.2"
# Promoted to a regular dep (P2·10b, 2026-08-22): the worker verifies the Ed25519-signed shard
# manifest before loading any shard weights (refuse-on-fail), so it needs the manifest type at
# runtime. One-way edge — hydra-modelsvc deps are gguf/blake3/ring/thiserror only, no cycle.
# A crate-dep change, NOT a package decision (rule 5): proceed + log.
hydra-modelsvc = { path = "../hydra-modelsvc" }
# P2·1: the sustained startup benchmark feeds its windows to the pure aggregator/EWMA in
# hydra-sched. One-way edge — hydra-sched has no deps but thiserror, so no cycle.
hydra-sched = { path = "../hydra-sched" }
flatbuffers.workspace = true
blake3.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "process", "signal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Promoted dev→regular (P1·1b seam B, 2026-07-19): the `hydra-3node-wan` runner bin hosts the
# coordinator's `BoundaryStore` durability target on the compute path, so it needs the coordinator at
# runtime, not only in tests. One-way edge — hydra-coordinator does NOT depend on hydra-worker (its
# deps are proto/wal/state/tokenizer), so no cycle. A crate-dep change, NOT a package decision
# (classified per standing rule 5): proceed + log (§7/§12).
hydra-coordinator = { path = "../hydra-coordinator" }
# Promoted dev→regular (P1·1b real-node kill runner, 2026-07-19): the `hydra-3node-kill` runner bin
# constructs an `Admission` for the coordinator commit stream at runtime. One-way edge — hydra-tokenizer
# deps are hydra-engine-sys only, no cycle. Classified crate-dep change (proceed+log).
hydra-tokenizer = { path = "../hydra-tokenizer" }

[dev-dependencies]
# Audit H6: the TOCTOU and O_NOFOLLOW regressions need real files staged in a temp dir, and the
# hardened-parser test replays the exact fuzz case that aborts the vendored parser.
tempfile = "3"
hydra-fuzz = { path = "../hydra-fuzz" }
tokio = { version = "1", features = ["full"] }
