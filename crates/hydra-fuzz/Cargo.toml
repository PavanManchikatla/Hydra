[package]
name = "hydra-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The parser-hardening arm (M4·1 c). It depends on every crate that parses UNTRUSTED input:
#   * `hydra-modelsvc` — GGUF, i.e. a downloaded community model file (report Addendum 2 §D1);
#   * `hydra-proto`    — the transport frame header, before any payload is allocated;
#   * `hydra-worker`   — the FlatBuffers frame body + the F1 fence, and the bootstrap blob;
#   * `hydra-wal`      — the on-disk record framing;
#   * `hydra-coordinator` — the BOUNDARY_COPY record payload read back from the boundary store
#                        (audit C3, rule 17: a boundary tensor parsed from the DISK is the same
#                        parser class as one parsed from the wire).
# Standing rule 17: when a defect class is found in one parser, EVERY parser of untrusted input is
# audited for it in the same wave and each becomes a target here. The dependency list is therefore
# the enumeration — if a parser is missing from it, that is the finding.
# It is a leaf: nothing depends on it, so it cannot affect what ships.
[dependencies]
hydra-modelsvc = { path = "../hydra-modelsvc" }
hydra-proto = { path = "../hydra-proto" }
hydra-worker = { path = "../hydra-worker" }
# Rule 17 — this dependency list IS the parser register, so a parser reached only TRANSITIVELY is
# absent from it in the sense that matters. `wire-body` drives `hydra_worker::wire`, which since
# M4·0 is a re-export of this crate; naming it directly is what makes the register readable.
hydra-wire = { path = "../hydra-wire" }
hydra-wal = { path = "../hydra-wal" }
hydra-coordinator = { path = "../hydra-coordinator" }
flatbuffers.workspace = true
# Audit H6: the VENDORED GGUF parser is the one the worker actually loads through; the Rust reader
# below it is the offline splitter's. Fuzzing one and reporting "the GGUF parser" covers the other
# by silence. Degrades to a stub when the engine is unavailable, and the target says so rather than
# disappearing.
hydra-engine-sys = { path = "../hydra-engine-sys" }
