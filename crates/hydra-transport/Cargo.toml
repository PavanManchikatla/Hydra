[package]
name = "hydra-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hydra transport: Transport trait + TCP+mTLS impl with cluster-CA pairing; framing per hydra-proto (validated pre-parse)."

[dependencies]
hydra-proto = { path = "../hydra-proto" }
# Audit H4: `BoundPeer::authenticated_rank()` mints `hydra_state::AuthenticatedRank` — the only
# way the activation quorum can learn a rank, since the wire carries none. One-way dep
# (hydra-state does not depend on this crate), so no cycle; hydra-state stays pure.
hydra-state = { path = "../hydra-state" }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
# Audit C2: the SAN->role binding TESTS a candidate name against the peer certificate rather than
# ENUMERATING the cert's SANs. That deliberately avoids introducing a new X.509 parser — which under
# standing rule 17 would itself become an untrusted-input parser needing a fuzz target. Already in
# the tree transitively via rustls; named here because the binding depends on it directly.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# Audit M3: certificates need explicit not_before/not_after — rcgen's defaults are 1975..4096.
time = "0.3"

[dev-dependencies]
# Audit M3: the regression reads the validity window and basic constraints back out of the DER —
# asserting the constant is set is not the same as asserting the certificate carries it.
x509-parser = "0.16"
tokio = { version = "1", features = ["full"] }
