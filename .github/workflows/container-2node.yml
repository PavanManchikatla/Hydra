name: container-2node

# M2 FWD slice, seam 4 — the containerized two-node recovery test (amended M2 DoD).
# Two `hydra-worker` CONTAINERS, real TCP+mTLS between the coordinator and each, `docker kill` as
# the kill −9 mechanism. Permanent workflow: on push (to the relevant paths), weekly, and dispatch.
# Rule-16 spirit: the job is GREEN only if the log proves the recovery assertion held
# (`CONTAINER_2NODE_RECOVERY_OK`) — a container/runner exit alone is never mapped to pass.

on:
  push:
    paths:
      - 'crates/hydra-worker/**'
      - 'crates/hydra-state/**'
      - 'crates/hydra-transport/**'
      - 'crates/hydra-proto/**'
      - 'docker/hydra-worker.Dockerfile'
      # **The submodule PIN determines which engine gets built (audit L1 closed 2026-08-25),
      # so a change to it is the highest-consequence change this repo can carry — and until
      # now it triggered NOTHING here. Same shape as the fuzz.yml path drift of §7.60: a fact
      # about the tree living in a second place nobody updated when the first one moved.**
      - '.gitmodules'
      - 'vendor/llama.cpp'
      - 'crates/hydra-engine-sys/**'
      - '.github/workflows/container-2node.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '30 6 * * 1'   # weekly Monday 06:30 UTC

jobs:
  two-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # No submodule init → hydra-engine-sys degrades to its control-plane stub (no model, no C++
      # toolchain needed); this CI exercises the two-node kill/recover machinery, not the engine.
      - uses: actions/checkout@v4

      - name: Build the control-plane hydra-worker image
        run: docker build -f docker/hydra-worker.Dockerfile -t hydra-worker:ci .

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build the container-2node runner (engine-stubbed, control-plane)
        run: cargo build --release --bin hydra-2node-ci -p hydra-worker

      - name: Run the two-node docker-kill recovery
        env:
          HYDRA_WORKER_IMAGE: hydra-worker:ci
        run: |
          set -o pipefail
          ./target/release/hydra-2node-ci 2>&1 | tee ci-2node.log

      - name: Assert the recovery assertion held (rule-16 spirit — the log, not the exit)
        run: |
          if grep -q "CONTAINER_2NODE_RECOVERY_OK" ci-2node.log; then
            echo "verdict=GREEN (two-node docker-kill recovery held)"
          else
            echo "verdict=FAIL — CONTAINER_2NODE_RECOVERY_OK absent; recovery assertion did NOT hold"
            exit 1
          fi

      # ---------------- M3 gate row 14(a): the network-jitter chaos arm ----------------
      # `tc netem` needs NET_ADMIN and a real network namespace, so the Linux containers of this
      # workflow are its ONLY home — the owner's Mac cannot inject it natively (no tc, and the
      # local-pair is loopback in one process). Annotated as such rather than pretended otherwise:
      # this arm is CONTAINER-CI-ONLY, and it is a correctness check under jitter, never a latency
      # measurement (the wired-LAN envelope remains separately owed and hardware-contingent).
      - name: Inject network jitter (tc netem) and re-run the recovery
        env:
          HYDRA_WORKER_IMAGE: hydra-worker:ci
        run: |
          set -o pipefail
          # 50 ms ± 20 ms of normally-distributed delay with 1 % loss and reordering, applied to the
          # container bridge both workers sit on. The recovery must still hold: jitter may degrade
          # latency, it may never change what the pipeline computes.
          sudo tc qdisc add dev docker0 root netem delay 50ms 20ms distribution normal loss 1% reorder 25% 50% \
            || { echo "verdict=FAIL — could not install netem on docker0"; exit 1; }
          tc qdisc show dev docker0
          ./target/release/hydra-2node-ci 2>&1 | tee ci-2node-jitter.log || true
          sudo tc qdisc del dev docker0 root || true

      - name: Assert the recovery held UNDER JITTER (rule 16 — the log, not the exit)
        run: |
          if grep -q "CONTAINER_2NODE_RECOVERY_OK" ci-2node-jitter.log; then
            echo "verdict=GREEN (two-node docker-kill recovery held under tc netem jitter)"
          else
            echo "verdict=FAIL — CONTAINER_2NODE_RECOVERY_OK absent under jitter; correctness did NOT hold"
            exit 1
          fi

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f hydra-ci-s1 hydra-ci-sp hydra-ci-sp2 2>/dev/null || true
          sudo tc qdisc del dev docker0 root 2>/dev/null || true
