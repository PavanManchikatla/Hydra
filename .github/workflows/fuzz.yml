name: fuzz

# M4·1 (c) — parser fuzzing for every parser of untrusted input in the tree.
#
# BLUEPRINT §3 (M4 DoD): "GGUF parser fuzzed for 24 CPU-hours without crashes."
# Report Addendum 2 §D1: model files are untrusted input; GGUF parsing has had real CVEs.
#
# The 24 CPU-hours are ACCUMULATED across runs, not claimed by one. Each run reports the CPU-seconds
# it actually spent, and the receipts under `verification/ci-results/` carry the running total — the
# DoD is met when the banked receipts add up, and never before.
#
# Rule 16, as everywhere: the job is GREEN only if the LOG says so. A green check-mark from a runner
# is not evidence; the `verdict=` lines the driver prints are.
#
# **THE ENGINE IS BUILT HERE (directive 2026-09-01, item 4b).** Until 2026-09-01 this workflow never
# initialised the submodule, so `hydra-engine-sys` built its stub and the `vendored-gguf` target —
# the one that drives `gguf_init_from_file`, i.e. the parser a WORKER actually loads a shard
# through — reported `verdict=UNAVAILABLE` on every leg. Every CPU-hour banked before this change
# is on the seven pure-Rust parsers. From the first leg on this workflow, "GGUF parser fuzzed" also
# means the vendored parser, and `vendored-gguf` is a REQUIRED target: a shard whose engine is
# the stub is INCONCLUSIVE, never green. The engine build is cached on the submodule SHA so leg
# time goes to fuzzing, not compiling.
#
# Shape: `--seconds` per shard × `matrix.shard` shards × 8 targets, in parallel. Every shard uses a
# DIFFERENT seed, so parallelism buys coverage rather than repetition — running the same seed N
# times would multiply the CPU-hours without adding a single new input.

on:
  push:
    paths:
      - 'crates/hydra-fuzz/**'
      - 'crates/hydra-modelsvc/**'
      - 'crates/hydra-proto/**'
      # M4·0 extracted the codec out of `hydra-worker/src/wire.rs` into its own crate. This filter
      # still named the old path, so a wire-codec change stopped triggering the push leg entirely
      # (the weekly `--target all` leg still covered it, so this was latency, not a hole).
      - 'crates/hydra-wire/**'
      - 'crates/hydra-worker/**'
      # **The submodule PIN determines which engine gets built (audit L1 closed 2026-08-25),
      # so a change to it is the highest-consequence change this repo can carry — and until
      # now it triggered NOTHING here. Same shape as the fuzz.yml path drift of §7.60: a fact
      # about the tree living in a second place nobody updated when the first one moved.**
      - '.gitmodules'
      - 'vendor/llama.cpp'
      - 'crates/hydra-engine-sys/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'CPU-seconds per shard (split evenly across the targets). Default 900 = the weekly leg. Directive 2026-09-01 item 5 authorises 2700 for dispatched acceleration legs — receipt them as "dispatched, not scheduled" (rule 24).'
        required: false
        default: '900'
      targets:
        description: 'Target list for the driver (`all`, or a single target such as `vendored-gguf`). Only the listed targets are REQUIRED by the classify step; the receipt must state the restriction (rule 24). Default all.'
        required: false
        default: 'all'
      force_stub_shard:
        description: 'RULE-25 SELF-TEST ONLY: shard number (1-8) to build with HYDRA_FORCE_ENGINE_STUB=1, so the classify step can be watched refusing an engine-less shard as INCONCLUSIVE. Leave empty for a real leg.'
        required: false
        default: ''
  schedule:
    - cron: '15 4 * * 2'   # weekly Tuesday 04:15 UTC — a leg toward the 24 CPU-hour DoD

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # 8 shards × 900 s ≈ 2 CPU-hours per weekly leg. A dispatched 2700 s leg is 45 min of fuzzing
    # plus a (cached) engine build, so the ceiling is raised well above it; the Actions job limit
    # is 360 minutes.
    timeout-minutes: 90
    strategy:
      # `fail-fast: false` so one crashing shard does not cancel the others — the CPU-seconds the
      # survivors spend are real evidence and are not thrown away because a sibling found a bug.
      fail-fast: false
      matrix:
        # Shard count is fixed here rather than exposed as a dispatch input, because a matrix cannot
        # be resized from an input without `fromJSON` gymnastics — and a knob that silently does
        # nothing is worse than no knob. Change the list to change the width.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # The submodule IS the engine (audit L1 closed): the pinned fork carries the layer-window
      # patch, so a plain init gives the tree the tests were run on.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Record the engine pin (the receipt names it; the cache is keyed on it)
        id: pin
        run: |
          sha=$(git -C vendor/llama.cpp rev-parse HEAD)
          echo "engine-pin=$sha"
          echo "engine-pin-status=$(git -C vendor/llama.cpp status --porcelain | wc -l | tr -d ' ') modified files (must be 0)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The build tree is what `hydra-engine-sys/build.rs` links (`vendor/llama.cpp/build/bin`).
      # Cached on the exact submodule SHA + the configure flags below: a pin change rebuilds, a
      # push that leaves the pin alone restores in seconds. CPU backend only — this is a parser
      # target, and the runner has no GPU. `GGML_NATIVE=OFF` so the cached binary does not depend
      # on which CPU model the runner happened to be.
      - name: Restore the engine build tree
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: vendor/llama.cpp/build
          key: engine-build-v1-${{ runner.os }}-${{ steps.pin.outputs.sha }}-cpu-shared-nonative

      - name: Build the vendored engine (llama + ggml-cpu, shared, CPU only)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S vendor/llama.cpp -B vendor/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build vendor/llama.cpp/build --target llama -j"$(nproc)"
          ls -la vendor/llama.cpp/build/bin/ | grep -E 'libllama|libggml' || { echo "engine libs missing after build"; exit 1; }

      # Release, because a release build runs ~10x more cases per second and CPU-hours are the DoD.
      # The debug build is NOT redundant: `cargo test -p hydra-fuzz` runs the same generator in
      # debug on every push, where arithmetic overflow PANICS instead of wrapping silently. Both
      # matter — debug catches the overflow, release reaches deeper. This is stated because running
      # only release would quietly give up the overflow oracle.
      #
      # **Rule 25 self-test:** `force_stub_shard` builds ONE shard deliberately engine-less so the
      # classify step's refusal can be observed firing (an oracle must be able to produce the
      # failure it guards). A real leg leaves it empty.
      - name: Build the fuzz driver (release, linked against the vendored engine)
        env:
          FORCE_STUB: ${{ github.event.inputs.force_stub_shard == format('{0}', matrix.shard) && '1' || '' }}
        run: |
          set -o pipefail
          if [ -n "$FORCE_STUB" ]; then
            echo "engine=STUB (forced by force_stub_shard=${{ github.event.inputs.force_stub_shard }} — rule-25 self-test)"
            HYDRA_FORCE_ENGINE_STUB=1 cargo build --release -p hydra-fuzz --bin hydra-fuzz 2>&1 | tee build.log
          else
            cargo build --release -p hydra-fuzz --bin hydra-fuzz 2>&1 | tee build.log
            # The build script announces a stub loudly; a real leg must have built none. This is
            # checked from the build LOG, not inferred from the cache step's status.
            if grep -qiE 'building a stub|building the STUB' build.log; then
              echo "engine=STUB — hydra-engine-sys did not link the vendored engine on a real leg"
              grep -iE 'building a stub|building the STUB' build.log
              echo "verdict=INCONCLUSIVE (the engine was not linked, so vendored-gguf cannot run — the leg is not evidence about the vendored parser)"
              exit 1
            fi
            echo "engine=REAL (no stub message in the build log)"
          fi

      # `--target all` covers EIGHT targets — every parser of untrusted input in the tree, per
      # standing rule 17 (a defect class fixed in one parser and left in another is not fixed):
      # manifest/bootstrap/wal-record added by audit Wave 1a, boundary-record by Wave 1c (C3),
      # vendored-gguf by Wave 3 (H6) and REQUIRED since 2026-09-01. A fixed --seconds buys
      # proportionally less time per target. The classify step below requires ALL EIGHT to report
      # AND to have been driven, so a silently-dropped or stubbed target is INCONCLUSIVE, never a pass.
      - name: Fuzz (shard ${{ matrix.shard }}, distinct seed)
        env:
          SECONDS_PER_SHARD: ${{ github.event.inputs.seconds || '900' }}
          TARGETS: ${{ github.event.inputs.targets || 'all' }}
        run: |
          set -o pipefail
          SEED=$(( ${{ matrix.shard }} * 1000003 ))
          echo "shard-seconds=$SECONDS_PER_SHARD trigger=${{ github.event_name }} targets=$TARGETS"
          ./target/release/hydra-fuzz \
            --target "$TARGETS" \
            --seconds "$SECONDS_PER_SHARD" \
            --seed "$SEED" 2>&1 | tee "fuzz-shard-${{ matrix.shard }}.log"

      - name: Classify (rule 16 — read the verdict lines, never the exit status)
        env:
          TARGETS: ${{ github.event.inputs.targets || 'all' }}
        run: |
          LOG="fuzz-shard-${{ matrix.shard }}.log"
          echo "--- verdict lines ---"
          grep -E '^(target=|FUZZ SUMMARY)' "$LOG" || true
          echo "---------------------"

          # **A vendored-parser ABORT leaves no summary and no CRASH line** — SIGABRT inside
          # libggml kills the process, so the driver cannot report it. What survives is the IN-FLIGHT
          # marker the driver writes before every probe (audit H6's reproduction contract): if it is
          # still there, it names the case that killed the shard. Read it FIRST, so an abort is RED
          # with replay coordinates rather than a generic "the driver did not finish".
          MARKER="${TMPDIR:-/tmp}/hydra-fuzz-vendored/IN-FLIGHT"
          if [ -f "$MARKER" ]; then
            cp "$MARKER" "fuzz-shard-${{ matrix.shard }}.IN-FLIGHT"
            echo "verdict=RED (the vendored parser ABORTED mid-case — a live finding on OUR pinned fork; rule 8: duplicate-search upstream master first. In-flight case: $(cat "$MARKER"))"
            exit 1
          fi
          # A missing summary line is a FAILURE, not a pass. A job that produced no verdict proves
          # nothing, and mapping "no output" to green is exactly the masked-failure shape rule 16
          # exists to prevent (§7.14/§7.15 caught it twice).
          if ! grep -q '^FUZZ SUMMARY' "$LOG"; then
            echo "verdict=INCONCLUSIVE (no FUZZ SUMMARY line — the driver did not finish)"
            exit 1
          fi
          # Every target must have reported, or the run covered less than it claims — and every
          # target must have been DRIVEN, not merely mentioned. Until 2026-08-24 the driver printed
          # verdict=GREEN for a target it had skipped entirely, so "reported" and "ran" were not the
          # same claim and nothing here could tell them apart.
          #
          # `vendored-gguf` is in this list since 2026-09-01: the engine is built above, so a shard
          # on which it reports UNAVAILABLE is a shard whose engine is the stub — INCONCLUSIVE.
          # (`force_stub_shard` exists precisely so this branch can be watched firing.)
          # A restricted dispatch (`targets` input) requires only what it asked for — and its receipt
          # must say so; it never counts toward the other parsers.
          if [ "$TARGETS" = "all" ]; then REQUIRED="gguf frame-header wire-body manifest bootstrap wal-record boundary-record vendored-gguf"; else REQUIRED="$TARGETS"; fi
          echo "required-targets=$REQUIRED"
          for t in $REQUIRED; do
            grep -q "^target=$t " "$LOG" || { echo "verdict=INCONCLUSIVE (target $t never reported)"; exit 1; }
            grep -qE "^target=$t .*verdict=UNAVAILABLE" "$LOG" && {
              echo "verdict=INCONCLUSIVE (required target $t reported UNAVAILABLE — it was not driven; on vendored-gguf that means the engine was not linked)"; exit 1; }
          done
          # Belt and braces: the summary's own gap count must be zero now that all eight are required.
          grep '^FUZZ SUMMARY' "$LOG" | grep -qE 'unavailable=0' || {
            echo "verdict=INCONCLUSIVE (summary reports an unavailable target: $(grep '^FUZZ SUMMARY' "$LOG"))"; exit 1; }
          if grep -qE '^CRASH ' "$LOG"; then
            echo "verdict=RED (parser crash — replay coordinates are in the CRASH lines above; a vendored-gguf crash is a live finding on OUR pinned fork: rule 8, duplicate-search upstream master first)"
            exit 1
          fi
          grep '^FUZZ SUMMARY' "$LOG" | grep -q 'verdict=GREEN' || {
            echo "verdict=RED (summary is not GREEN)"; exit 1; }
          echo "verdict=GREEN ($(grep '^FUZZ SUMMARY' "$LOG"))"
          echo "--- coverage note for the receipt ---"
          echo "vendored-gguf: $(grep '^target=vendored-gguf ' "$LOG")"

      - name: Upload the shard log (the receipt's raw source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: |
            fuzz-shard-${{ matrix.shard }}.log
            fuzz-shard-${{ matrix.shard }}.IN-FLIGHT
            build.log
          if-no-files-found: ignore
          retention-days: 90
