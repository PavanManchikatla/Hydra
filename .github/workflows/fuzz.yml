name: fuzz

# M4·1 (c) — parser fuzzing for the two untrusted-input surfaces.
#
# BLUEPRINT §3 (M4 DoD): "GGUF parser fuzzed for 24 CPU-hours without crashes."
# Report Addendum 2 §D1: model files are untrusted input; GGUF parsing has had real CVEs.
#
# The 24 CPU-hours are ACCUMULATED across runs, not claimed by one. Each run reports the CPU-seconds
# it actually spent, and the receipts under `verification/ci-results/` carry the running total — the
# DoD is met when the banked receipts add up, and never before.
#
# Rule 16, as everywhere: the job is GREEN only if the LOG says so. A green check-mark from a runner
# is not evidence; the `verdict=` lines the driver prints are.
#
# Shape: `--seconds` per shard × `matrix.shard` shards × 3 targets, in parallel. Every shard uses a
# DIFFERENT seed, so parallelism buys coverage rather than repetition — running the same seed N
# times would multiply the CPU-hours without adding a single new input.

on:
  push:
    paths:
      - 'crates/hydra-fuzz/**'
      - 'crates/hydra-modelsvc/**'
      - 'crates/hydra-proto/**'
      # M4·0 extracted the codec out of `hydra-worker/src/wire.rs` into its own crate. This filter
      # still named the old path, so a wire-codec change stopped triggering the push leg entirely
      # (the weekly `--target all` leg still covered it, so this was latency, not a hole).
      - 'crates/hydra-wire/**'
      - 'crates/hydra-worker/**'
      - '.github/workflows/fuzz.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'CPU-seconds per shard (split evenly across the 3 targets)'
        required: false
        default: '900'
  schedule:
    - cron: '15 4 * * 2'   # weekly Tuesday 04:15 UTC — a leg toward the 24 CPU-hour DoD

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # 8 shards × 900 s ≈ 2 CPU-hours per weekly leg; ~12 legs reach the DoD.
    timeout-minutes: 45
    strategy:
      # `fail-fast: false` so one crashing shard does not cancel the others — the CPU-seconds the
      # survivors spend are real evidence and are not thrown away because a sibling found a bug.
      fail-fast: false
      matrix:
        # Shard count is fixed here rather than exposed as a dispatch input, because a matrix cannot
        # be resized from an input without `fromJSON` gymnastics — and a knob that silently does
        # nothing is worse than no knob. Change the list to change the width.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # No submodule init → hydra-engine-sys degrades to its control-plane stub. The parsers under
      # test are pure Rust and need no engine; this also keeps the arm cheap enough to run weekly.
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      # Release, because a release build runs ~10x more cases per second and CPU-hours are the DoD.
      # The debug build is NOT redundant: `cargo test -p hydra-fuzz` runs the same generator in
      # debug on every push, where arithmetic overflow PANICS instead of wrapping silently. Both
      # matter — debug catches the overflow, release reaches deeper. This is stated because running
      # only release would quietly give up the overflow oracle.
      - name: Build the fuzz driver (release)
        run: cargo build --release -p hydra-fuzz --bin hydra-fuzz

      # `--target all` now covers EIGHT targets, SEVEN of which run here — every parser of untrusted input in the tree, per
      # standing rule 17 (a defect class fixed in one parser and left in another is not fixed):
      # manifest/bootstrap/wal-record added by audit Wave 1a, boundary-record by Wave 1c (C3). A
      # fixed --seconds buys proportionally less time per target. The classify step below requires
      # ALL SEVEN to report, so a silently-dropped target is INCONCLUSIVE rather than a pass.
      - name: Fuzz (shard ${{ matrix.shard }}, distinct seed)
        env:
          SECONDS_PER_SHARD: ${{ github.event.inputs.seconds || '900' }}
        run: |
          set -o pipefail
          SEED=$(( ${{ matrix.shard }} * 1000003 ))
          ./target/release/hydra-fuzz \
            --target all \
            --seconds "$SECONDS_PER_SHARD" \
            --seed "$SEED" 2>&1 | tee "fuzz-shard-${{ matrix.shard }}.log"

      - name: Classify (rule 16 — read the verdict lines, never the exit status)
        run: |
          LOG="fuzz-shard-${{ matrix.shard }}.log"
          echo "--- verdict lines ---"
          grep -E '^(target=|FUZZ SUMMARY)' "$LOG" || true
          echo "---------------------"

          # A missing summary line is a FAILURE, not a pass. A job that produced no verdict proves
          # nothing, and mapping "no output" to green is exactly the masked-failure shape rule 16
          # exists to prevent (§7.14/§7.15 caught it twice).
          if ! grep -q '^FUZZ SUMMARY' "$LOG"; then
            echo "verdict=INCONCLUSIVE (no FUZZ SUMMARY line — the driver did not finish)"
            exit 1
          fi
          # Every target must have reported, or the run covered less than it claims.
          # NOTE (audit H6): `vendored-gguf` is deliberately NOT in this list. It requires the real
          # engine, and CI never builds it (audit L1 — build.rs degrades to a stub), so requiring it
          # here would fail every run for a reason that has nothing to do with the parsers. Its CI
          # status is UNAVAILABLE, not green, and the receipts must say which parser they protect.
          for t in gguf frame-header wire-body manifest bootstrap wal-record boundary-record; do
            grep -q "^target=$t " "$LOG" || { echo "verdict=INCONCLUSIVE (target $t never reported)"; exit 1; }
            # A REQUIRED target must have been DRIVEN, not merely mentioned. Until 2026-08-24 the
            # driver printed verdict=GREEN for a target it had skipped entirely, so "reported" and
            # "ran" were not the same claim and nothing here could tell them apart.
            grep -qE "^target=$t .*verdict=UNAVAILABLE" "$LOG" && {
              echo "verdict=INCONCLUSIVE (required target $t reported UNAVAILABLE — it was not driven)"; exit 1; }
          done
          # `vendored-gguf` is EXPECTED to be unavailable here (audit L1). Assert that it says so
          # rather than trusting it to: if it ever prints GREEN in CI, either the engine got built
          # (good — promote it to the required list) or the target went back to claiming a green it
          # did not earn (the §7.62 defect). Both need a human, so both stop the run.
          if grep -qE "^target=vendored-gguf .*verdict=GREEN" "$LOG"; then
            echo "verdict=INCONCLUSIVE (vendored-gguf reported GREEN in CI, where the engine is not built —"
            echo "  either L1 is fixed and this target should be REQUIRED, or it is claiming an unearned green)"
            exit 1
          fi
          if grep -qE '^CRASH ' "$LOG"; then
            echo "verdict=RED (parser crash — replay coordinates are in the CRASH lines above)"
            exit 1
          fi
          grep '^FUZZ SUMMARY' "$LOG" | grep -q 'verdict=GREEN' || {
            echo "verdict=RED (summary is not GREEN)"; exit 1; }
          # The summary now carries `unavailable=N`, so the quoted line states its own gap.
          echo "verdict=GREEN ($(grep '^FUZZ SUMMARY' "$LOG"))"
          echo "--- coverage note for the receipt (Wave-3 directive: say which parser is protected) ---"
          grep -E "^target=.*verdict=UNAVAILABLE" "$LOG" || echo "(every configured target was driven)"

      - name: Upload the shard log (the receipt's raw source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-shard-${{ matrix.shard }}
          path: fuzz-shard-${{ matrix.shard }}.log
          retention-days: 90
